<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro del Banco</title>
  <style>
    :root{
      --wood-dark: #241812;
      --wood-mid: #3a2a1e;
      --wood-panel: #423123;
      --parchment: #e9dcbb;
      --parchment-dim: #c9b992;
      --brass: #c08a2e;
      --brass-bright: #e0a83f;
      --ink-red: #a84335;
      --ink-green: #6c935c;
      --line: rgba(233, 220, 187, 0.14);
    }

    *{ box-sizing: border-box; }

    body{
      margin: 0;
      background: var(--wood-dark);
      background-image:
        radial-gradient(circle at 15% 10%, rgba(255,255,255,0.03), transparent 40%),
        radial-gradient(circle at 85% 90%, rgba(255,255,255,0.02), transparent 45%);
      color: var(--parchment);
      font-family: Georgia, 'Times New Roman', serif;
      padding: 28px 16px 120px;
    }

    .header{
      max-width: 900px;
      margin: 0 auto 22px;
      text-align: left;
      border-bottom: 2px solid var(--brass);
      padding-bottom: 14px;
    }

    .header h1{
      font-size: 30px;
      letter-spacing: 0.5px;
      margin: 0 0 4px;
      color: var(--brass-bright);
      font-weight: normal;
      font-variant: small-caps;
    }

    .header p{
      margin: 0;
      color: var(--parchment-dim);
      font-size: 14px;
      font-style: italic;
    }

    .wrap{
      max-width: 900px;
      margin: 0 auto;
      display: grid;
      gap: 18px;
    }

    .category{
      background: var(--wood-panel);
      border: 1px solid var(--line);
      border-radius: 3px;
      overflow: hidden;
    }

    .category-head{
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      background: var(--wood-mid);
      border-bottom: 1px solid var(--line);
      cursor: pointer;
      user-select: none;
    }

    .category-head .arrow{
      margin-left: auto;
      color: var(--brass);
      font-size: 12px;
      transition: transform 0.2s ease;
    }

    .category.collapsed .category-head{
      border-bottom: none;
    }

    .category.collapsed .arrow{
      transform: rotate(-90deg);
    }

    .category-body{
      overflow: hidden;
    }

    .category.collapsed .category-body{
      display: none;
    }

    .category-head .icon{ font-size: 18px; }

    .category-head h2{
      font-size: 15px;
      font-weight: normal;
      letter-spacing: 0.5px;
      margin: 0;
      color: var(--parchment);
      font-variant: small-caps;
    }

    .cat-type-label{
      font-size: 12px;
      font-variant: normal;
      letter-spacing: 0;
      margin-left: 4px;
    }

    .cat-type-label.negative{
      text-decoration: underline;
      text-decoration-color: var(--ink-red);
      color: var(--ink-red);
    }

    .cat-type-label.positive{
      text-decoration: underline;
      text-decoration-color: var(--ink-green);
      color: var(--ink-green);
    }

    .rows{ padding: 4px 0; }

    .item-group {
      border-bottom: 1px solid var(--line);
      padding: 6px 16px;
    }
    .item-group:last-child { border-bottom: none; }

    .row{
      display: grid;
      grid-template-columns: 1fr 100px 90px 90px;
      align-items: center;
      gap: 10px;
      padding: 4px 0;
    }

    .item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    .item-name{ font-size: 14.5px; font-weight: bold; color: var(--parchment); }

    .price-input, .qty-input{
      width: 100%;
      background: var(--wood-dark);
      border: 1px solid var(--line);
      color: var(--parchment);
      font-family: 'Courier New', monospace;
      font-size: 14px;
      text-align: center;
      padding: 5px 4px;
      border-radius: 2px;
    }
    
    .price-input:focus, .qty-input:focus{
      outline: none;
      border-color: var(--brass);
    }

    .row-total{
      font-family: 'Courier New', monospace;
      text-align: right;
      font-size: 14.5px;
      color: var(--brass-bright);
      min-width: 70px;
    }

    .add-qty-btn {
      background: transparent;
      border: 1px dashed var(--brass);
      color: var(--brass-bright);
      font-size: 11px;
      padding: 2px 8px;
      cursor: pointer;
      border-radius: 2px;
    }
    .add-qty-btn:hover {
      background: rgba(192, 138, 46, 0.2);
    }

    .remove-qty-btn {
      background: transparent;
      border: none;
      color: var(--ink-red);
      font-size: 14px;
      cursor: pointer;
      padding: 0 4px;
    }

    .category-subtotal{
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      padding: 8px 16px;
      background: rgba(0,0,0,0.15);
      font-family: 'Courier New', monospace;
      font-size: 13px;
      color: var(--parchment-dim);
    }

    .footer-bar{
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--wood-dark);
      border-top: 2px solid var(--brass);
      padding: 14px 16px;
      display: flex;
      justify-content: center;
    }

    .footer-inner{
      max-width: 900px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .grand-total{
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    .grand-total .label{
      font-size: 14px;
      color: var(--parchment-dim);
      font-variant: small-caps;
    }

    .grand-total .amount{
      font-family: 'Courier New', monospace;
      font-size: 30px;
      color: var(--brass-bright);
      font-weight: bold;
    }

    .reset-btn{
      background: transparent;
      border: 1px solid var(--ink-red);
      color: var(--ink-red);
      padding: 10px 18px;
      font-family: Georgia, serif;
      font-size: 14px;
      font-variant: small-caps;
      border-radius: 2px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .reset-btn:hover{
      background: var(--ink-red);
      color: var(--parchment);
    }

    @media (max-width: 480px){
      .row{
        grid-template-columns: 1fr 80px 65px 65px;
        gap: 6px;
      }
      .item-name{ font-size: 13px; }
      .header h1{ font-size: 24px; }
      .grand-total .amount{ font-size: 24px; }
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>Registro del Banco</h1>
    <p>Inserisci le quantità portate dal cliente — i prezzi sono modificabili ed il totale si aggiorna da solo</p>
  </div>

  <div class="wrap" id="categories"></div>

  <div class="footer-bar">
    <div class="footer-inner">
      <button class="reset-btn" onclick="resetAll()">Svuota registro</button>
      <div class="grand-total">
        <span class="label">Totale dovuto</span>
        <span class="amount" id="grandTotal">$0.00</span>
      </div>
    </div>
  </div>
