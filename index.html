<<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Native Post - Registro del Banco</title>
  <link href="https://fonts.googleapis.com/css2?family=Rye&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient-start: #0b132b;
      --bg-gradient-mid: #1c2541;
      --bg-gradient-end: #0a192f;
      
      --panel-bg: rgba(26, 37, 64, 0.88);
      --panel-header: #24335c;
      --border-color: rgba(92, 118, 163, 0.35);
      
      --parchment: #e2e8f0;
      --parchment-dim: #94a3b8;
      
      --gold: #f59e0b;
      --gold-bright: #fbbf24;
      
      --ink-red: #ef4444;
      --ledger-green: #10b981;
      
      --western-font: 'Rye', serif;
      --mono-font: 'Fira Code', monospace;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-mid), var(--bg-gradient-end));
      background-attachment: fixed;
      color: var(--parchment);
      font-family: var(--western-font);
      padding: 28px 16px 140px;
    }

    .header {
      max-width: 950px;
      margin: 0 auto 28px;
      text-align: center;
      border-bottom: 3px solid var(--gold);
      padding-bottom: 18px;
    }

    .header-logo-container {
      width: 100%;
      max-width: 820px;
      margin: 0 auto 12px;
    }

    .header-logo-svg {
      width: 100%;
      height: auto;
      display: block;
      filter: drop-shadow(0 8px 16px rgba(0,0,0,0.85));
    }

    .header p {
      margin: 8px 0 0;
      color: var(--gold-bright);
      font-size: 20px;
      font-family: var(--western-font);
      letter-spacing: 1px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.6);
    }

    .wrap {
      max-width: 950px;
      margin: 0 auto;
      display: grid;
      gap: 22px;
    }

    .category {
      background: var(--panel-bg);
      border: 2px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 6px 16px rgba(0,0,0,0.4);
    }

    .category-head {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 20px;
      background: linear-gradient(to right, #1e293b, var(--panel-header));
      border-bottom: 2px solid var(--border-color);
      cursor: pointer;
      user-select: none;
    }

    .category-head .arrow {
      margin-left: auto;
      color: var(--gold);
      font-size: 18px;
      transition: transform 0.25s ease;
    }

    .category.collapsed .category-head {
      border-bottom: none;
    }

    .category.collapsed .arrow {
      transform: rotate(-90deg);
    }

    .category-body {
      overflow: hidden;
    }

    .category.collapsed .category-body {
      display: none;
    }

    .category-head .icon { font-size: 26px; }

    .category-head h2 {
      font-size: 22px;
      font-weight: normal;
      letter-spacing: 0.8px;
      margin: 0;
      color: var(--gold-bright);
    }

    .neg-label {
      color: var(--ink-red);
      font-size: 14px;
      font-family: var(--mono-font);
      background: rgba(239, 68, 68, 0.18);
      padding: 3px 10px;
      border-radius: 4px;
      border: 1px solid rgba(239, 68, 68, 0.35);
    }

    .pos-label {
      color: var(--ledger-green);
      font-size: 14px;
      font-family: var(--mono-font);
      background: rgba(16, 185, 129, 0.18);
      padding: 3px 10px;
      border-radius: 4px;
      border: 1px solid rgba(16, 185, 129, 0.35);
    }

    .rows { padding: 8px 0; }

    .item-group {
      border-bottom: 1px solid rgba(255,255,255,0.08);
      padding: 12px 20px;
    }
    .item-group:last-child { border-bottom: none; }

    .row {
      display: grid;
      grid-template-columns: 1fr 110px 100px 120px;
      align-items: center;
      gap: 14px;
      padding: 6px 0;
    }

    .item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .item-name { 
      font-size: 18px; 
      color: var(--parchment); 
      font-family: var(--western-font);
      letter-spacing: 0.5px;
    }

    .price-input, .qty-input {
      width: 100%;
      background: #0f172a;
      border: 1px solid var(--border-color);
      color: var(--gold-bright);
      font-family: var(--mono-font);
      font-size: 16px;
      text-align: center;
      padding: 8px 6px;
      border-radius: 4px;
    }
    
    .price-input:focus, .qty-input:focus {
      outline: none;
      border-color: var(--gold);
      box-shadow: 0 0 8px rgba(245, 158, 11, 0.4);
    }

    .row-total {
      font-family: var(--mono-font);
      text-align: right;
      font-size: 17px;
      color: var(--gold-bright);
      min-width: 80px;
    }

    .add-qty-btn {
      background: rgba(245, 158, 11, 0.15);
      border: 1px dashed var(--gold);
      color: var(--gold-bright);
      font-size: 13px;
      font-family: var(--western-font);
      padding: 5px 12px;
      cursor: pointer;
      border-radius: 4px;
      transition: background 0.2s;
    }
    .add-qty-btn:hover {
      background: rgba(245, 158, 11, 0.35);
    }

    .remove-qty-btn {
      background: transparent;
      border: none;
      color: var(--ink-red);
      font-size: 18px;
      cursor: pointer;
      padding: 0 4px;
      font-weight: bold;
    }

    .category-subtotal {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      padding: 14px 20px;
      background: rgba(0,0,0,0.35);
      font-family: var(--mono-font);
      font-size: 17px;
      color: var(--parchment-dim);
      border-top: 1px solid var(--border-color);
    }

    .category-subtotal span {
      color: var(--gold-bright);
      font-weight: 600;
    }

    .footer-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #090e1a;
      border-top: 3px solid var(--gold);
      padding: 16px 20px;
      display: flex;
      justify-content: center;
      box-shadow: 0 -6px 20px rgba(0,0,0,0.8);
      z-index: 100;
    }

    .footer-inner {
      max-width: 950px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .grand-total {
      display: flex;
      align-items: baseline;
      gap: 16px;
    }

    .grand-total .label {
      font-size: 19px;
      color: var(--parchment);
      font-family: var(--western-font);
    }

    .grand-total .amount {
      font-family: var(--mono-font);
      font-size: 34px;
      color: var(--gold-bright);
      font-weight: bold;
    }

    .reset-btn {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid var(--ink-red);
      color: var(--ink-red);
      padding: 12px 22px;
      font-family: var(--western-font);
      font-size: 16px;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    .reset-btn:hover {
      background: var(--ink-red);
      color: #fff;
    }

    @media (max-width: 600px){
      .row {
        grid-template-columns: 1fr 85px 75px 85px;
        gap: 8px;
      }
      .item-name { font-size: 16px; }
      .grand-total .amount { font-size: 26px
